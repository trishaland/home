<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Nonaktif</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      text-align: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 90%;
    }

    .container img {
      width: 100%;
      max-width: 250px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 22px;
      margin: 0;
      font-weight: 500;
      letter-spacing: 1px;
    }

    p {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 18px;
      }
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="nonaktif.jpg" alt="Web Nonaktif">
    <h1>Web ini sudah di nonaktifkan</h1>
    <p>Silakan hubungi admin untuk informasi lebih lanjut.</p>
  </div>

</body>
</html>
